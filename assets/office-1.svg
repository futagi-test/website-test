<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="事務所の風景サンプル：受付">
  <defs>
    <linearGradient id="wall1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9F8EF"/>
      <stop offset="1" stop-color="#FBFEFB"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#wall1)"/>
  <!-- 床 -->
  <rect y="400" width="1200" height="120" fill="#E8EAD9"/>
  <rect y="400" width="1200" height="6" fill="#CDECC2"/>
  <!-- 窓 -->
  <rect x="120" y="70" width="300" height="190" rx="8" fill="#FFFFFF" stroke="#8FD66A" stroke-width="6"/>
  <line x1="270" y1="70" x2="270" y2="260" stroke="#8FD66A" stroke-width="6"/>
  <line x1="120" y1="165" x2="420" y2="165" stroke="#8FD66A" stroke-width="6"/>
  <!-- サイン YH -->
  <rect x="500" y="90" width="170" height="120" rx="14" fill="#12A96F"/>
  <text x="585" y="170" font-family="'Noto Sans JP',sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle">YH</text>
  <!-- 観葉植物 -->
  <rect x="1000" y="300" width="70" height="100" rx="8" fill="#BDD6A9"/>
  <path d="M1035 300 C1000 250 1010 200 1035 180 C1060 200 1070 250 1035 300 Z" fill="#12A96F"/>
  <path d="M1035 300 C995 270 985 230 995 205 C1030 225 1045 265 1035 300 Z" fill="#8FD66A"/>
  <!-- 受付カウンター -->
  <rect x="160" y="320" width="620" height="90" rx="10" fill="#12A96F"/>
  <rect x="160" y="320" width="620" height="22" rx="8" fill="#087A59"/>
  <rect x="610" y="270" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#8FD66A" stroke-width="4"/>
  <!-- ラベル -->
  <g>
    <rect x="40" y="450" width="250" height="40" rx="20" fill="rgba(51,51,51,0.55)"/>
    <text x="60" y="476" font-family="'Noto Sans JP',sans-serif" font-size="20" font-weight="500" fill="#FFFFFF">① 受付（サンプル画像）</text>
  </g>
</svg>
